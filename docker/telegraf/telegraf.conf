[[inputs.mqtt_consumer]]
  servers = ["ssl://mosquitto:8883"]
  topics = ["fleet/+/telemetry/+"]
  tls_ca = "/certs/ca.crt"
  tls_cert = "/certs/client.crt"
  tls_key = "/certs/client.key"
  data_format = "json"
  name_override = "telemetry"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "$INFLUX_TOKEN"
  organization = "bmw-demo"
  bucket = "vehicle_data"